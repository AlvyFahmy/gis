<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peta Sebaran Populasi & Koordinat Customer</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Leaflet CSS & JS (100% Gratis Tanpa API Key) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet MarkerCluster CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- SheetJS (xlsx.js) untuk membaca Kordinat.xlsx dari GitHub -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #e2e8f0;
    }

    /* Custom Marker Cluster Styling */
    .custom-cluster {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.35);
      border: 3px solid #ffffff;
      transition: transform 0.2s ease;
    }
    .custom-cluster:hover {
      transform: scale(1.1);
    }
    .cluster-low {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    .cluster-med {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }
    .cluster-high {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    /* Single Pin Marker */
    .single-pin-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .single-pin-core {
      width: 22px;
      height: 22px;
      border-radius: 9999px;
      border: 3px solid #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease;
    }
    .single-pin-wrapper:hover .single-pin-core {
      transform: scale(1.25);
    }
    .single-pin-pulse {
      position: absolute;
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      opacity: 0.35;
      animation: pulseRing 2s infinite;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.7); opacity: 0.55; }
      100% { transform: scale(1.45); opacity: 0; }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 relative">

  <!-- Fullscreen Map Container -->
  <div id="map"></div>

  <!-- Top-Right Floating Controls (Basemap, Density & Sync) -->
  <div class="fixed top-4 right-4 z-[1000] flex flex-wrap items-center gap-2">
    <!-- Basemap Selector (Semua Gratis Tanpa API Key) -->
    <div class="bg-white/95 backdrop-blur-md shadow-lg border border-slate-200 rounded-xl p-1 flex items-center gap-1 text-xs font-semibold">
      <button onclick="setBasemap('voyager')" id="btn-map-voyager" class="basemap-btn px-3 py-1.5 rounded-lg bg-blue-600 text-white transition">
        <i class="fa-solid fa-map mr-1"></i>Jalan
      </button>
      <button onclick="setBasemap('satellite')" id="btn-map-satellite" class="basemap-btn px-3 py-1.5 rounded-lg text-slate-600 hover:bg-slate-100 transition">
        <i class="fa-solid fa-satellite mr-1"></i>Satelit
      </button>
      <button onclick="setBasemap('dark')" id="btn-map-dark" class="basemap-btn px-3 py-1.5 rounded-lg text-slate-600 hover:bg-slate-100 transition">
        <i class="fa-solid fa-moon mr-1"></i>Gelap
      </button>
    </div>

    <!-- Toggle Zona Kepadatan -->
    <button onclick="toggleDensityZones()" id="btn-density" class="bg-white/95 backdrop-blur-md shadow-lg border border-slate-200 hover:bg-slate-50 text-slate-700 px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition">
      <i class="fa-solid fa-fire text-amber-500"></i>
      <span>Zona Kepadatan</span>
    </button>

    <!-- Reset Zoom Nasional -->
    <button onclick="fitAllMarkers()" class="bg-white/95 backdrop-blur-md shadow-lg border border-slate-200 hover:bg-slate-50 text-slate-700 px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition" title="Lihat Semua Titik">
      <i class="fa-solid fa-expand text-blue-600"></i>
      <span class="hidden sm:inline">Reset Peta</span>
    </button>

    <!-- Sync GitHub Button -->
    <button onclick="syncFromGitHub()" id="btn-sync" class="bg-slate-900 hover:bg-slate-800 text-white shadow-lg px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition">
      <i class="fa-brands fa-github text-sm"></i>
      <span id="sync-text">Sync GitHub</span>
    </button>
  </div>

  <!-- Top-Left Floating Population Summary Card -->
  <div id="population-card" class="fixed top-4 left-4 z-[1000] w-80 max-w-[calc(100vw-2rem)] bg-white/95 backdrop-blur-md shadow-xl border border-slate-200/90 rounded-2xl overflow-hidden transition-all duration-300">
    <!-- Header -->
    <div class="px-4 py-3 bg-gradient-to-r from-slate-900 to-slate-800 text-white flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-blue-500/20 border border-blue-400/30 flex items-center justify-center text-blue-400">
          <i class="fa-solid fa-location-dot"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold leading-tight">Sebaran Populasi Titik</h1>
          <p id="data-source-badge" class="text-[11px] text-slate-300 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>
            Memuat data GitHub...
          </p>
        </div>
      </div>
      <button onclick="toggleSummaryBody()" class="w-7 h-7 rounded-lg hover:bg-white/10 flex items-center justify-center text-slate-300 transition" title="Minimize/Expand">
        <i id="summary-chevron" class="fa-solid fa-chevron-up text-xs"></i>
      </button>
    </div>

    <!-- Collapsible Body -->
    <div id="summary-body" class="p-4 space-y-3.5">
      <!-- KPI Strip -->
      <div class="grid grid-cols-2 gap-2.
